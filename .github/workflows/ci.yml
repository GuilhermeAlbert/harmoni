name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate macOS application
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust MSRV
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Verify application versions
        run: yarn version:check

      - name: Lint frontend
        run: yarn lint

      - name: Build static frontend
        run: yarn build

      - name: Check Rust host
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test Rust host
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust host
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Swift sidecar
        working-directory: native/macos-agent
        run: swift test

      - name: Build Swift sidecar
        run: yarn native:build

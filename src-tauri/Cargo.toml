[package]
name = "harmoni"
version = "0.1.0"
description = "A macOS desktop application for centralized device and peripheral management."
authors = ["Harmoni contributors"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "harmoni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
